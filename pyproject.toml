[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptkpn"
version = "1.0.0"
description = "Range-gated adaptive kernel prediction for zero-shot image denoising"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "Pillow>=10.0",
  "pydicom>=2.4",
  "scikit-image>=0.21",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
include = ["adaptkpn*", "baselines*"]
