model:
  stages: 3
  kernel_size: 5
  hidden_channels: 16
  smooth_mix: 0.75
  use_range_gate: true
  range_sigma_init: 0.08
  range_sigma_min: 0.005
  range_sigma_max: 0.25

training:
  epochs: 500
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.01
  scheduler: onecycle
  lambda_edge: 350.0
  use_ema: true
  ema_decay: 0.999
  amp: true

data:
  normalize: true
  crop_size: 256

mayo:
  kernel: B30
  window_min: -3000.0
  window_max: 3000.0
